<html lang="en">
<head>

<body><title>T-Minus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=VT323&family=Chakra+Petch:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,700&family=Instrument+Serif:ital@0;1&family=Press+Start+2P&family=Share+Tech+Mono&family=Tilt+Neon&family=Caveat:wght@500;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap">
<style>
/* T-Minus: a quiet instrument-panel shell (list + next-up hero) that hands each
   countdown to its own theme world when opened full screen. The shell stays neutral
   so the five themes carry the colour. */
:root {
  --bg: #e9ebec; --panel: #f4f5f5; --ink: #14171a; --ink-2: #565d63; --ink-3: #8a9196;
  --rule: #cdd2d5; --accent: #e2552b; --accent-ink: #ffffff; --focus: #e2552b;
  --f-ui: "Schibsted Grotesk", "Segoe UI", sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r: 5px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111315; --panel: #181b1e; --ink: #eceeef; --ink-2: #a3aaaf; --ink-3: #6f777d;
    --rule: #2a2f33; --accent: #f06a3f; --accent-ink: #111315; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111315; --panel: #181b1e; --ink: #eceeef; --ink-2: #a3aaaf; --ink-3: #6f777d;
  --rule: #2a2f33; --accent: #f06a3f; --accent-ink: #111315; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- shell ---------- */
.shell { max-width: 1080px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); padding-block: 22px 64px; display: grid; gap: 28px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font: 800 22px/1 var(--f-ui); letter-spacing: -.02em; }
.brand b i { font-style: normal; color: var(--accent); }
.brand span { font: 500 12px/1 var(--f-num); color: var(--ink-3); letter-spacing: .04em; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--rule); background: transparent; border-radius: var(--r); padding: 9px 14px; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { color: var(--ink); border-color: var(--rule); }
.btn.danger { color: #c4321a; }
.btn svg { width: 16px; height: 16px; }
.btn, .ib { white-space: nowrap; }
@media (max-width: 520px) { .brand span, #themeName, #editBtn span, #shareBtn span, .nb-long { display: none; } }

/* next-up hero: a live window into the soonest countdown, dressed in its theme */
.hero { position: relative; overflow: hidden; border-radius: 6px; min-height: 230px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 18px 28px; padding: clamp(18px, 3.4vw, 34px); cursor: pointer; background: var(--t-bg); color: var(--t-fg); border: 0; text-align: left; width: 100%; }
.hero::before { content: ""; position: absolute; inset: 0; background: var(--t-art); pointer-events: none; }
.hero > * { position: relative; }
.hero .eb { font: 500 12px/1 var(--t-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--t-acc); }
.hero h2 { margin: 10px 0 0; font: 700 clamp(26px, 4.4vw, 44px)/1.02 var(--t-head); letter-spacing: -.01em; text-wrap: balance; }
.hero .when { margin-top: 10px; font: 400 14px/1.4 var(--t-ui); color: var(--t-dim); }
.hero .big { font: var(--t-numw) clamp(40px, 8vw, 92px)/.9 var(--t-num); font-variant-numeric: tabular-nums; letter-spacing: var(--t-track, 0); white-space: nowrap; }
.hero .big small { display: block; font: 500 12px/1 var(--t-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--t-dim); margin-bottom: 10px; text-align: right; }
@media (max-width: 640px) { .hero { grid-template-columns: minmax(0, 1fr); } .hero .big small { text-align: left; } }

.sec { display: grid; gap: 4px; }
.sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 2px solid var(--ink); }
.sechead h3 { margin: 0; font: 800 13px/1 var(--f-ui); letter-spacing: .12em; text-transform: uppercase; }
.sechead span { font: 500 12px/1.3 var(--f-num); color: var(--ink-3); }
.row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 6px; border-bottom: 1px solid var(--rule); cursor: pointer; border-radius: 0; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
.row:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.row .ti { font-weight: 650; font-size: 16px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .me { font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.row .tm { font: 500 clamp(14px, 2.2vw, 18px)/1 var(--f-num); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.row .tm small { display: block; font: 500 11px/1 var(--f-ui); color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; margin-top: 5px; }
.row .tm.live { color: var(--accent); }
.tag { font: 600 10px/1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; padding: 3px 5px; border: 1px solid var(--rule); border-radius: 3px; color: var(--ink-2); align-self: center; }
.empty { padding: 22px 6px; color: var(--ink-2); font-size: 14px; border-bottom: 1px solid var(--rule); }
.empty b { color: var(--ink); }
.foot { font-size: 12px; color: var(--ink-3); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.linkish { background: none; border: 0; padding: 0; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; font-size: 12px; }

/* theme swatches: a small honest sample of each world */
.sw { width: 44px; height: 44px; border-radius: 4px; position: relative; overflow: hidden; background: var(--t-bg); display: grid; place-items: center; font: var(--t-numw) 17px/1 var(--t-num); color: var(--t-fg); }
.sw::before { content: ""; position: absolute; inset: 0; background: var(--t-art); }
.sw span { position: relative; }

/* per-theme tokens shared by swatch, hero and the focus view */
.th-board { --t-bg: #171b1e; --t-fg: #eef0ea; --t-acc: #e8aa2c; --t-dim: #8d969a; --t-num: "Big Shoulders Display", "Arial Narrow", sans-serif; --t-numw: 800; --t-head: "Big Shoulders Display", sans-serif; --t-ui: "IBM Plex Mono", monospace;
  --t-art: radial-gradient(circle at 1px 1px, rgba(170,180,185,.16) 1px, transparent 1.6px) 0 0 / 9px 14px; }
.th-minimal { --t-bg: #f6f6f4; --t-fg: #121212; --t-acc: #d4471f; --t-dim: #74746f; --t-num: "Instrument Serif", Georgia, serif; --t-numw: 400; --t-head: "Instrument Serif", Georgia, serif; --t-ui: "Schibsted Grotesk", sans-serif;
  --t-art: radial-gradient(circle at 85% 120%, transparent 59.6%, rgba(0,0,0,.09) 59.8%, rgba(0,0,0,.09) 60.2%, transparent 60.4%); }
.th-terminal { --t-bg: #040904; --t-fg: #5cff8a; --t-acc: #c8ff5c; --t-dim: #2b8a47; --t-num: "VT323", monospace; --t-numw: 400; --t-head: "VT323", monospace; --t-ui: "VT323", monospace; --t-track: .02em;
  --t-art: repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 1px, transparent 1px 3px), radial-gradient(ellipse at center, rgba(92,255,138,.08), transparent 70%); }
.th-space { --t-bg: #060a18; --t-fg: #e8edff; --t-acc: #7cc8ff; --t-dim: #7684ad; --t-num: "Chakra Petch", sans-serif; --t-numw: 600; --t-head: "Chakra Petch", sans-serif; --t-ui: "Chakra Petch", sans-serif;
  --t-art: radial-gradient(1px 1px at 20% 30%, #fff, transparent), radial-gradient(1px 1px at 70% 20%, #cfe0ff, transparent), radial-gradient(1.5px 1.5px at 40% 70%, #fff, transparent), radial-gradient(1px 1px at 85% 60%, #fff, transparent), radial-gradient(1px 1px at 10% 85%, #bcd, transparent), radial-gradient(ellipse at 100% 100%, rgba(124,200,255,.18), transparent 55%); }
.th-nature { --t-bg: #cfe3d2; --t-fg: #17301f; --t-acc: #c9781c; --t-dim: #47634f; --t-num: "Fraunces", Georgia, serif; --t-numw: 300; --t-head: "Fraunces", Georgia, serif; --t-ui: "Schibsted Grotesk", sans-serif;
  --t-art: radial-gradient(ellipse 70% 40% at 20% 105%, #6f9a68 98%, transparent 100%), radial-gradient(ellipse 80% 45% at 85% 115%, #4f7c52 98%, transparent 100%), radial-gradient(circle at 78% 26%, #f4c45a 0 9%, transparent 9.5%), linear-gradient(#f3e3c0, #cfe3d2 60%); }

.th-ocean { --t-bg: #06303f; --t-fg: #e8fcff; --t-acc: #62e3d2; --t-dim: #86b9c4; --t-num: "Schibsted Grotesk", sans-serif; --t-numw: 800; --t-head: "Schibsted Grotesk", sans-serif; --t-ui: "Schibsted Grotesk", sans-serif; --t-track: -.02em;
  --t-art: radial-gradient(ellipse 60% 30% at 30% 100%, rgba(98,227,210,.28) 98%, transparent 100%), radial-gradient(ellipse 70% 34% at 80% 108%, rgba(20,110,130,.8) 98%, transparent 100%), linear-gradient(#0c5870, #04202c); }
.th-arcade { --t-bg: #0a0a12; --t-fg: #ffffff; --t-acc: #ffd23f; --t-dim: #8388a0; --t-num: "Press Start 2P", monospace; --t-numw: 400; --t-head: "Press Start 2P", monospace; --t-ui: "Press Start 2P", monospace;
  --t-art: radial-gradient(2px 2px at 20% 30%, #ff5d5d, transparent), radial-gradient(2px 2px at 70% 22%, #5dd6ff, transparent), radial-gradient(2px 2px at 45% 75%, #ffd23f, transparent), radial-gradient(2px 2px at 85% 65%, #7dff7a, transparent); }
.th-blueprint { --t-bg: #12407a; --t-fg: #eef5ff; --t-acc: #ffe27a; --t-dim: #a6c5ec; --t-num: "Share Tech Mono", monospace; --t-numw: 400; --t-head: "Share Tech Mono", monospace; --t-ui: "Share Tech Mono", monospace;
  --t-art: linear-gradient(rgba(255,255,255,.14) 1px, transparent 1px) 0 0 / 100% 11px, linear-gradient(90deg, rgba(255,255,255,.14) 1px, transparent 1px) 0 0 / 11px 100%; }
.th-snow { --t-bg: #17263f; --t-fg: #f5f9ff; --t-acc: #bfe2ff; --t-dim: #93a8c8; --t-num: "Instrument Serif", Georgia, serif; --t-numw: 400; --t-head: "Instrument Serif", Georgia, serif; --t-ui: "Schibsted Grotesk", sans-serif;
  --t-art: radial-gradient(2px 2px at 25% 25%, #fff, transparent), radial-gradient(1.5px 1.5px at 60% 45%, #fff, transparent), radial-gradient(2px 2px at 80% 20%, #fff, transparent), radial-gradient(1.5px 1.5px at 40% 70%, #fff, transparent), radial-gradient(ellipse 90% 30% at 50% 112%, #e9f1fb 98%, transparent 100%), linear-gradient(#22375a, #17263f); }
.th-sunset { --t-bg: #16202b; --t-fg: #fff4e2; --t-acc: #ff8f45; --t-dim: #cfae93; --t-num: "Chakra Petch", sans-serif; --t-numw: 700; --t-head: "Chakra Petch", sans-serif; --t-ui: "Chakra Petch", sans-serif;
  --t-art: radial-gradient(circle at 50% 78%, #ffb054 0 22%, transparent 22.5%), linear-gradient(#16202b 0%, #7a3b2e 55%, #ff8f45 78%, #121a22 78.5%); }
.th-aurora { --t-bg: #060d18; --t-fg: #eafff5; --t-acc: #5dffb0; --t-dim: #8fb3ad; --t-num: "Schibsted Grotesk", sans-serif; --t-numw: 500; --t-head: "Schibsted Grotesk", sans-serif; --t-ui: "Schibsted Grotesk", sans-serif; --t-track: -.02em;
  --t-art: radial-gradient(ellipse 80% 30% at 50% 108%, #04080e 98%, transparent 100%), linear-gradient(100deg, transparent 20%, rgba(93,255,176,.5) 40%, rgba(53,201,255,.4) 55%, transparent 75%), linear-gradient(#060d18, #0d2030); }
.th-neon { --t-bg: #130d14; --t-fg: #ffe9f4; --t-acc: #ff4f9a; --t-dim: #a98a9c; --t-num: "Tilt Neon", sans-serif; --t-numw: 400; --t-head: "Tilt Neon", sans-serif; --t-ui: "Schibsted Grotesk", sans-serif;
  --t-art: radial-gradient(ellipse at 50% 50%, rgba(255,79,154,.35), transparent 65%), linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px) 0 0 / 100% 9px; }
.th-rain { --t-bg: #0e1620; --t-fg: #eef4fb; --t-acc: #ffb86b; --t-dim: #93a3b5; --t-num: "Schibsted Grotesk", sans-serif; --t-numw: 400; --t-head: "Instrument Serif", Georgia, serif; --t-ui: "Schibsted Grotesk", sans-serif;
  --t-art: radial-gradient(circle at 25% 70%, rgba(255,184,107,.4) 0 14%, transparent 15%), radial-gradient(circle at 70% 60%, rgba(107,208,255,.3) 0 18%, transparent 19%), radial-gradient(circle at 50% 85%, rgba(255,122,89,.3) 0 12%, transparent 13%), repeating-linear-gradient(105deg, transparent 0 7px, rgba(200,220,255,.12) 7px 8px); }
.th-chalk { --t-bg: #20322b; --t-fg: #f4f2e8; --t-acc: #ffe07a; --t-dim: #a9b8ad; --t-num: "Caveat", cursive; --t-numw: 700; --t-head: "Caveat", cursive; --t-ui: "Caveat", cursive;
  --t-art: radial-gradient(1px 1px at 30% 40%, rgba(255,255,255,.5), transparent), radial-gradient(1px 1px at 65% 70%, rgba(255,255,255,.4), transparent), radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.25)); }
.th-party { --t-bg: #ffe9c9; --t-fg: #2a1a12; --t-acc: #e23d5b; --t-dim: #8a6a55; --t-num: "Bricolage Grotesque", sans-serif; --t-numw: 800; --t-head: "Bricolage Grotesque", sans-serif; --t-ui: "Bricolage Grotesque", sans-serif; --t-track: -.03em;
  --t-art: radial-gradient(circle at 22% 38%, #e23d5b 0 13%, transparent 13.5%), radial-gradient(circle at 74% 30%, #2f9e8f 0 15%, transparent 15.5%), radial-gradient(circle at 55% 72%, #f2a51f 0 11%, transparent 11.5%); }
.sw.th-arcade, .tp.th-arcade .pv { font-size: 9px; }
.hero.th-arcade .big { font-size: clamp(18px, 3.6vw, 42px); line-height: 1.3; }
.hero.th-arcade h2 { font-size: clamp(16px, 2.6vw, 26px); line-height: 1.3; }

/* ---------- editor sheet ---------- */
.scrim { position: fixed; inset: 0; background: rgba(10,12,14,.45); z-index: 40; display: grid; place-items: end center; padding: 0; }
@media (min-width: 700px) { .scrim { place-items: center; padding: 24px; } }
.sheet { background: var(--panel); color: var(--ink); width: min(620px, 100%); max-height: min(92vh, 860px); overflow: auto; border-radius: 8px 8px 0 0; padding: 22px clamp(16px, 4vw, 28px) 20px; display: grid; gap: 18px; border: 1px solid var(--rule); }
@media (min-width: 700px) { .sheet { border-radius: 8px; } }
.sheet h2 { margin: 0; font: 800 20px/1.1 var(--f-ui); letter-spacing: -.01em; }
.field { display: grid; gap: 6px; }
.field > span { font: 600 12px/1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.field input[type=text], .field input[type=date], .field input[type=time] { width: 100%; padding: 11px 12px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--bg); }
.field input:focus { outline: none; border-color: var(--ink); }
.calwrap { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 560px) { .calwrap { grid-template-columns: minmax(0, 1fr); } }
.cal { border: 1px solid var(--rule); border-radius: var(--r); padding: 8px; background: var(--bg); }
.calh { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 2px 2px 8px; }
.calh b { font-weight: 700; font-size: 14px; }
.calh button { border: 1px solid var(--rule); background: none; border-radius: 4px; width: 30px; height: 28px; line-height: 1; font-size: 15px; }
.calg { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.calg i { font: 600 10px/1 var(--f-ui); color: var(--ink-3); text-align: center; padding: 4px 0 6px; font-style: normal; text-transform: uppercase; letter-spacing: .04em; }
.calg button { position: relative; border: 1px solid transparent; background: none; border-radius: 4px; height: 34px; font: 500 13px/1 var(--f-num); font-variant-numeric: tabular-nums; padding: 0; }
.calg button:hover { border-color: var(--rule); }
.calg button.past { color: var(--ink-3); }
.calg button.today { border-color: var(--ink-2); }
.calg button.hol { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--ink); font-weight: 700; }
.calg button.hol::after { content: ""; position: absolute; left: 50%; bottom: 4px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); }
.calg button.sel { background: var(--ink); color: var(--bg); }
.calg button.sel::after { background: var(--bg); }
.calside { display: grid; gap: 12px; }
.holl { display: grid; gap: 4px; }
.holl > span { font: 600 12px/1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); padding-bottom: 2px; }
.holl button { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; text-align: left; border: 1px solid var(--rule); background: none; border-radius: 4px; padding: 7px 9px; font-size: 13.5px; }
.holl button:hover, .holl button.on { border-color: var(--accent); }
.holl button small { font: 500 12px/1 var(--f-num); color: var(--ink-3); white-space: nowrap; }
.holl p { margin: 0; font-size: 13px; color: var(--ink-3); }
.tpick { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .tpick { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tp { border: 1px solid var(--rule); border-radius: 6px; padding: 0; background: none; overflow: hidden; text-align: left; display: grid; }
.tp .pv { height: 58px; background: var(--t-bg); position: relative; display: grid; place-items: center; font: var(--t-numw) 22px/1 var(--t-num); color: var(--t-fg); }
.tp .pv::before { content: ""; position: absolute; inset: 0; background: var(--t-art); }
.tp .pv span { position: relative; }
.tp b { font: 600 12px/1.2 var(--f-ui); padding: 7px 8px; }
.tp[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--ink); }
.check small { display: block; color: var(--ink-2); font-size: 12.5px; }
.acts { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; padding-top: 6px; border-top: 1px solid var(--rule); }
.acts > div { display: flex; gap: 8px; }
.err { color: #c4321a; font-size: 13px; }

/* ---------- focus view ---------- */
.focus { position: fixed; inset: 0; z-index: 30; background: var(--t-bg); color: var(--t-fg); overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; font-family: var(--t-ui); }
.focus canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#fx { z-index: 5; }
.fhead, .fmain, .ffoot { position: relative; z-index: 2; }
.fhead { display: flex; align-items: center; gap: 6px; padding: calc(env(safe-area-inset-top, 0px) + 12px) clamp(12px, 3vw, 28px) 0; }
.fhead .sp { flex: 1; }
.ib { display: inline-flex; align-items: center; gap: 7px; background: color-mix(in srgb, var(--t-bg) 55%, transparent); border: 1px solid color-mix(in srgb, var(--t-fg) 22%, transparent); color: var(--t-fg); border-radius: 5px; padding: 8px 11px; font: 500 13px/1 var(--t-ui); letter-spacing: .02em; }
.ib:hover { border-color: var(--t-fg); }
.ib svg { width: 16px; height: 16px; }

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const DAY = 864e5;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pad = n => String(n).padStart(2, '0');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const uid = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join('');

  /* ================= themes ================= */
  const THEMES = {
    board:    { name: 'Departure board', blurb: 'Split-flap station board', digit: 'flap', glyph: '0:2',
                words: { down: 'Departs in', up: 'In service for', today: 'Now arriving' }, labels: ['Days', 'Hours', 'Min', 'Sec'] },
    minimal:  { name: 'Minimal', blurb: 'Quiet type, one thin line', digit: 'roll', glyph: '12',
                words: { down: 'until', up: 'since', today: 'is today' }, labels: ['days', 'hours', 'minutes', 'seconds'] },
    terminal: { name: 'Retro terminal', blurb: 'Phosphor CRT, scanlines', digit: 'glitch', glyph: '>_',
                words: { down: '> T-MINUS', up: '> T-PLUS', today: '> EVENT ACTIVE' }, labels: ['DD', 'HH', 'MM', 'SS'] },
    space:    { name: 'Night sky', blurb: 'Starfield and an orbit', digit: 'roll', glyph: 'T−',
                words: { down: 'T minus', up: 'T plus', today: 'Event window open' }, labels: ['Days', 'Hrs', 'Min', 'Sec'] },
    nature:   { name: 'Nature', blurb: 'Hills, sky and the time of day', digit: 'roll', glyph: '9',
                words: { down: 'until', up: 'since', today: 'is today' }, labels: ['days', 'hours', 'minutes', 'seconds'] },
    ocean:    { name: 'Ocean', blurb: 'Swell, light rays, rising bubbles', digit: 'roll', glyph: '≈',
                words: { down: 'Tide comes in', up: 'Tide went out', today: 'High tide today' }, labels: ['Days', 'Hours', 'Min', 'Sec'] },
    arcade:   { name: 'Arcade', blurb: 'Pixel invaders, one shot a second', digit: 'glitch', glyph: '1UP',
                words: { down: 'Get ready', up: 'Game on for', today: 'Player one start' }, labels: ['Days', 'Hrs', 'Min', 'Sec'] },
    blueprint:{ name: 'Blueprint', blurb: 'Drafting grid and dimension lines', digit: 'roll', glyph: '⌖',
                words: { down: 'Time remaining', up: 'Time elapsed', today: 'Due today' }, labels: ['Days', 'Hours', 'Min', 'Sec'] },
    snow:     { name: 'Snowfall', blurb: 'Quiet night, drifting snow', digit: 'roll', glyph: '❄',
                words: { down: 'until', up: 'since', today: 'is today' }, labels: ['days', 'hours', 'minutes', 'seconds'] },
    sunset:   { name: 'Sunset drive', blurb: 'Low sun over a moving grid', digit: 'roll', glyph: '◐',
                words: { down: 'Arriving in', up: 'On the road for', today: 'Arriving today' }, labels: ['Days', 'Hrs', 'Min', 'Sec'] },
    aurora:   { name: 'Aurora', blurb: 'Northern lights over mountains', digit: 'roll', glyph: '≋',
                words: { down: 'Counting down to', up: 'Time since', today: 'Tonight' }, labels: ['Days', 'Hours', 'Min', 'Sec'] },
    neon:     { name: 'Neon sign', blurb: 'Glowing tubes on a brick wall', digit: 'glitch', glyph: '24',
                words: { down: 'Opening in', up: 'Open for', today: 'Open tonight' }, labels: ['Days', 'Hours', 'Min', 'Sec'] },
    rain:     { name: 'Rainy window', blurb: 'City lights behind wet glass', digit: 'roll', glyph: '☂',
                words: { down: 'until', up: 'since', today: 'is today' }, labels: ['days', 'hours', 'minutes', 'seconds'] },
    chalk:    { name: 'Chalkboard', blurb: 'Hand-drawn, with a tally of seconds', digit: 'roll', glyph: '||||',
                words: { down: 'only this long until', up: 'this long since', today: 'today!' }, labels: ['days', 'hours', 'minutes', 'seconds'] },
    party:    { name: 'Party', blurb: 'Balloons, bunting, confetti', digit: 'roll', glyph: '●',
                words: { down: 'Get ready for', up: 'Still celebrating', today: 'It’s today' }, labels: ['Days', 'Hours', 'Min', 'Sec'] },
  };
  const TKEYS = Object.keys(THEMES);

  /* ================= time maths ================= */
  // effective occurrence: yearly countdowns celebrate for a day, then roll to next year
  function occ(cd, now) {
    let t = cd.target, prev;
    if (cd.repeat === 'yearly') {
      const d = new Date(t);
      let guard = 0;
      while (t + DAY <= now && guard++ < 400) { d.setFullYear(d.getFullYear() + 1); t = d.getTime(); }
      const p = new Date(t); p.setFullYear(p.getFullYear() - 1); prev = p.getTime();
    } else prev = Math.min(cd.createdAt || t - 30 * DAY, t - 60e3);
    const mode = now < t ? 'down' : (cd.repeat === 'yearly' ? 'today' : 'up');
    return { t, prev, mode, prog: clamp((now - prev) / (t - prev), 0, 1) };
  }
  function split(ms) {
    const s = Math.floor(Math.abs(ms) / 1000);
    return { d: Math.floor(s / 86400), h: Math.floor(s % 86400 / 3600), m: Math.floor(s % 3600 / 60), s: s % 60, total: s };
  }
  const fmtWhen = t => new Intl.DateTimeFormat(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(t));
  const fmtShort = t => new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(t));
  function compact(cd, now) {
    const o = occ(cd, now), p = split(o.t - now);
    if (o.mode === 'today') return { text: 'Today', sub: 'happening now', live: true, o };
    const hms = `${pad(p.h)}:${pad(p.m)}:${pad(p.s)}`;
    const text = (o.mode === 'up' ? '+' : '') + (p.d ? `${p.d}d ${hms}` : hms);
    return { text, sub: o.mode === 'up' ? 'since' : 'to go', live: false, o };
  }

  /* ================= storage ================= */
  const KEY = 'tminus.v1';
  let mine = [], shared = [], sharedOK = false, sharedRO = false;
  const me = { id: null, owner: false, can: null };
  let userNS = null, dbNS = null;
  function loadMine() {
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
    if (raw && Array.isArray(raw.items)) { mine = raw.items; return; }
    mine = examples(); saveMine();
  }
  function saveMine() { try { localStorage.setItem(KEY, JSON.stringify({ items: mine })); } catch (e) {} }
  function at(y, mo, d, h) { return new Date(y, mo, d, h || 0, 0, 0).getTime(); }
  function examples() {
    const now = Date.now(), y = new Date().getFullYear();
    const next = (mo, d, h) => { let t = at(y, mo, d, h); if (t + DAY <= now) t = at(y + 1, mo, d, h); return t; };
    const c = now - 7 * DAY;
    return [
      { id: uid(), title: 'Halloween', target: next(9, 31, 18), theme: 'terminal', repeat: 'yearly', createdAt: c, example: true },
      { id: uid(), title: 'Christmas', target: next(11, 25, 0), theme: 'minimal', repeat: 'yearly', createdAt: c, example: true },
      { id: uid(), title: 'New Year ' + (y + 1), target: at(y + 1, 0, 1, 0), theme: 'space', repeat: 'none', createdAt: c, example: true },
      { id: uid(), title: 'First day of spring', target: next(2, 20, 0), theme: 'nature', repeat: 'yearly', createdAt: c, example: true },
    ];
  }
  const all = () => mine.concat(shared);
  // a countdown opened from a share link lives only in memory until the viewer saves it

      g.fillStyle = sh; g.beginPath(); g.ellipse(x, y, r, ry, 0, 0, 6.283); g.fill();
      g.strokeStyle = 'rgba(220,235,255,.22)'; g.lineWidth = Math.max(.6, r * .08); g.beginPath(); g.ellipse(x, y, r * .94, ry * .94, 0, Math.PI * .1, Math.PI * .9); g.stroke();
      g.fillStyle = 'rgba(255,255,255,.8)'; g.beginPath(); g.ellipse(x - r * .34, y - ry * .46, r * .22, r * .12, -.6, 0, 6.283); g.fill();
      if (r > 6) { g.fillStyle = 'rgba(255,255,255,.25)'; g.beginPath(); g.ellipse(x + r * .3, y + ry * .55, r * .3, r * .08, .3, 0, 6.283); g.fill(); }
    }
    return {
      resize() {
        K.size(); dpr = Math.min(2, devicePixelRatio || 1);
        scene = offscreen(14); sharp = offscreen(2);
        drops = Array.from({ length: Math.max(30, Math.round(K.W * K.H / 13000)) }, newDrop);
        tiny = Array.from({ length: Math.round(K.W * K.H / 1400) }, () => [Math.random() * K.W, Math.random() * K.H, .7 + Math.random() * 1.5]);
        streaks = Array.from({ length: Math.round(K.W / 14) }, () => ({ x: Math.random() * K.W, y: Math.random() * K.H, l: 14 + Math.random() * 24, v: 14 + Math.random() * 10 }));
        trails = [];
      },
      pulse(kind) {
        if (reduce) return;
        if (kind === 'min') flash = performance.now();
        if (kind === 'sec') { const big = drops.filter(d => !d.v && d.r > 7); const d = big[Math.random() * big.length | 0]; if (d) { d.v = .5; d.ly = d.y; trails.push(d.trail = { x: d.x, y0: d.y, y1: d.y, w: d.r * .9, t0: 0 }); } }
      },
      frame(now) {
        const g = K.g, W = K.W, H = K.H;
        if (!scene) return;
        g.drawImage(scene, 0, 0, W, H);
        g.strokeStyle = 'rgba(190,210,235,.15)'; g.lineWidth = 1; g.beginPath();
        for (const s of streaks) { if (!reduce) { s.y += s.v; s.x -= s.v * .12; if (s.y > H) { s.y = -30; s.x = Math.random() * (W + 60); } } g.moveTo(s.x, s.y); g.lineTo(s.x - s.l * .12, s.y + s.l); }
        g.stroke();
        g.fillStyle = 'rgba(175,195,215,.08)'; g.fillRect(0, 0, W, H); // fog on the glass
        // wet trails: clearer glass where a drop has run, fading as the fog returns
        trails = trails.filter(t => !t.t0 || now - t.t0 < 9000);
        for (const t of trails) {
          const a = t.t0 ? 1 - (now - t.t0) / 9000 : 1;
          g.save(); g.globalAlpha = .55 * a; g.beginPath(); g.rect(t.x - t.w / 2, t.y0, t.w, t.y1 - t.y0); g.clip();
          g.drawImage(sharp, 0, 0, W, H); g.restore();
        }
        g.fillStyle = 'rgba(215,228,245,.3)';
        for (const t of tiny) g.fillRect(t[0], t[1], t[2], t[2]);
        for (const d of drops) {
          if (d.v && !reduce) {
            d.v = Math.min(d.v + .045 * (d.r / 10), 3.4);
            const py = d.y; d.y += d.v; d.x += Math.sin(now / 260 + d.wob) * .3;
            if (d.trail) { d.trail.y1 = d.y; d.trail.x = d.trail.x * .9 + d.x * .1; }
            for (const t of tiny) if (t[1] > py - 3 && t[1] < d.y + 3 && Math.abs(t[0] - d.x) < d.r) { t[0] = Math.random() * W; t[1] = Math.random() * H; }
            if (d.y - d.ly > 26 && Math.random() < .5) { d.ly = d.y; drops.push({ x: d.x + (Math.random() - .5) * d.r, y: d.y - d.r * 1.6, r: 1.2 + Math.random() * 1.8, v: 0, wob: 0, ly: 0, crumb: now }); }
            if (d.y - d.r > H) { if (d.trail) d.trail.t0 = now; Object.assign(d, newDrop(), { trail: null }); }
          }
          lens(g, d);
        }
        // trail crumbs evaporate after a while so the glass never fills up
        if (drops.length > 400 || (now | 0) % 50 === 0) drops = drops.filter(d => !d.crumb || now - d.crumb < 14000);
        const fl = now - flash;
        if (fl < 520) { g.fillStyle = `rgba(230,240,255,${(fl < 80 || (fl > 170 && fl < 230) ? .4 : .1) * (1 - fl / 520)})`; g.fillRect(0, 0, W, H); }
      },
      finale() { flash = performance.now(); for (let i = 0; i < 8; i++) this.pulse('sec'); FX.burst('dot', ['#ffb86b', '#6bd0ff', '#eef4fb'], 140); },
    };
  };

  // Chalkboard: a boiling hand-drawn ring round the clock and a tally mark for every second of the minute.
  BG.chalk = cv => {
    const K = canvasKit(cv); let dust = [];
    const jit = (i, j, k) => (hash(i, j, k) % 1000) / 1000 - .5;
    return {
      resize() { K.size(); dust = Array.from({ length: 500 }, () => [Math.random() * K.W, Math.random() * K.H, Math.random() * .12]); },
      pulse() {},
      frame(now) {
        const g = K.g; g.clearRect(0, 0, K.W, K.H);
        g.fillStyle = '#fff'; for (const d of dust) { g.globalAlpha = d[2]; g.fillRect(d[0], d[1], 1.5, 1.5); }
        const j = reduce ? 0 : Math.floor(now / 170), [cx, cy, r] = centerOf($('fclock'));
        g.globalAlpha = .8; g.strokeStyle = '#f4f2e8'; g.lineWidth = 2.4; g.lineCap = 'round';
        const rx = r.width * .58 + 20, ry = r.height * .9 + 20;
        g.beginPath(); for (let i = 0; i <= 56; i++) { const a = i / 54 * 6.283 - 1.2, w = 1 + jit(i, j, 1) * .03; const x = cx + Math.cos(a) * rx * w, y = cy + Math.sin(a) * ry * w + jit(i, j, 2) * 3; i ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke();
        const n = new Date().getSeconds(), x0 = Math.max(20, cx - 6 * 23), y0 = Math.min(K.H - 110, r.bottom + ry * .55);
        g.strokeStyle = '#ffe07a'; g.lineWidth = 2.6; g.beginPath();
        for (let i = 0; i < n; i++) { const gp = i / 5 | 0, k = i % 5, bx = x0 + (gp % 6) * 46, by = y0 + (gp / 6 | 0) * 38; if (k < 4) { g.moveTo(bx + k * 8 + jit(i, 1, 3) * 2, by); g.lineTo(bx + k * 8 + jit(i, 2, 3) * 2, by + 26); } else { g.moveTo(bx - 5, by + 20); g.lineTo(bx + 30, by + 5); } }
        g.stroke(); g.globalAlpha = 1;
      },
      finale() { FX.burst('confetti', ['#f4f2e8', '#ffe07a', '#f6a6b8', '#9fd6ff'], 150); },
    };
  };

  // Party: bunting across the top, balloons drifting up, a light drizzle of confetti. More balloons every minute.
  BG.party = cv => {
    const K = canvasKit(cv); let bal = [], conf = [];
    const C = ['#e23d5b', '#2f9e8f', '#f2a51f', '#3b6fd6', '#f07c3a'];
    const mk = y => ({ x: Math.random() * K.W, y, r: 20 + Math.random() * 20, c: C[Math.random() * C.length | 0], v: .3 + Math.random() * .6, ph: Math.random() * 6.283 });
    return {
      resize() { K.size(); bal = Array.from({ length: Math.max(8, Math.round(K.W / 110)) }, () => mk(Math.random() * K.H)); conf = Array.from({ length: 50 }, () => ({ x: Math.random() * K.W, y: Math.random() * K.H, v: .4 + Math.random(), c: C[Math.random() * C.length | 0], r: Math.random() * 6.283, vr: (Math.random() - .5) * .08 })); },
      pulse(kind) { if (kind === 'min' && !reduce && bal.length < 60) for (let i = 0; i < 6; i++) bal.push(mk(K.H + 40 + Math.random() * 120)); },
      frame(now) {
        const g = K.g, t = reduce ? 0 : now / 1000;
        const gr = g.createLinearGradient(0, 0, 0, K.H); gr.addColorStop(0, '#fff3dc'); gr.addColorStop(1, '#ffd9b0'); g.fillStyle = gr; g.fillRect(0, 0, K.W, K.H);
        for (const b of bal) {
          if (!reduce) { b.y -= b.v; b.x += Math.sin(t + b.ph) * .3; } if (b.y < -90) Object.assign(b, mk(K.H + 60));
          g.strokeStyle = 'rgba(42,26,18,.35)'; g.lineWidth = 1; g.beginPath(); g.moveTo(b.x, b.y + b.r * 1.2); g.quadraticCurveTo(b.x + Math.sin(t * 2 + b.ph) * 8, b.y + b.r * 2.2, b.x, b.y + b.r * 3.2); g.stroke();
          g.globalAlpha = .9; g.fillStyle = b.c; g.beginPath(); g.ellipse(b.x, b.y, b.r * .84, b.r, 0, 0, 6.283); g.fill(); g.beginPath(); g.moveTo(b.x - 4, b.y + b.r * 1.2); g.lineTo(b.x + 4, b.y + b.r * 1.2); g.lineTo(b.x, b.y + b.r * .95); g.fill();
          g.globalAlpha = .35; g.fillStyle = '#fff'; g.beginPath(); g.ellipse(b.x - b.r * .3, b.y - b.r * .35, b.r * .16, b.r * .3, -.5, 0, 6.283); g.fill(); g.globalAlpha = 1;
        }
        for (const c of conf) { if (!reduce) { c.y += c.v; c.r += c.vr; if (c.y > K.H) { c.y = -6; c.x = Math.random() * K.W; } } g.save(); g.translate(c.x, c.y); g.rotate(c.r); g.fillStyle = c.c; g.fillRect(-4, -1.5, 8, 3); g.restore(); }
        const n = Math.max(8, Math.round(K.W / 60)), sag = 38, y0 = 54;
        g.strokeStyle = '#2a1a12'; g.lineWidth = 1.5; g.beginPath();
        const py = u => y0 + Math.sin(u * Math.PI) * sag + Math.sin(t * 1.4 + u * 6) * 2;
        for (let i = 0; i <= 40; i++) { const u = i / 40; i ? g.lineTo(u * K.W, py(u)) : g.moveTo(0, py(0)); } g.stroke();
        for (let i = 0; i < n; i++) { const u = (i + .5) / n, x = u * K.W, y = py(u), w = K.W / n * .36, sw = Math.sin(t * 1.6 + i) * 3; g.fillStyle = C[i % C.length]; g.beginPath(); g.moveTo(x - w, y); g.lineTo(x + w, y); g.lineTo(x + sw, y + w * 2.1); g.fill(); }
      },
      finale() { this.pulse('min'); FX.burst('confetti', C, 220); },
    };
  };

  /* ================= focus view ================= */
  let focusId = null, api = null, bgi = null, raf = 0, lastSec = -1, lastMode = null, previewTheme = null;
  const F = $('focus');
  function openFocus(id, keep) {
    const cd = find(id); if (!cd) return;
    focusId = id;
    if (!keep) previewTheme = null;
    const theme = previewTheme || cd.theme;
    F.className = 'focus th-' + theme; F.style.cssText = ''; F._fg = null;
    F.hidden = false; $('shell').setAttribute('aria-hidden', 'true');
    document.body.style.overflow = 'hidden';
    $('ftitle').textContent = cd.title;
    $('themeName').textContent = THEMES[theme].name;
    $('editBtn').hidden = !cd.linked && cd.shared && !canEditShared(cd);
    $('editBtn').classList.toggle('keep', !!cd.linked);
    $('editBtn').lastElementChild.textContent = cd.linked ? 'Save to my list' : 'Edit';
    $('shareBtn').hidden = !canLink; $('shareLbl').textContent = 'Share link';
    $('flog').textContent = ''; $('flog').hidden = theme !== 'terminal';
    $('tmenu').hidden = true;
    api = makeClock($('fclock'), theme);
    lastSec = -1; lastMode = null;
    FX.clear();
    const cv = $('bg'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
    bgi = BG[theme](cv);
    focusTick(true);
    bgi.resize(); // the view is visible now, so layout is real
    cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
    if (!cd.linked) try { history.replaceState(null, '', '#c-' + id); } catch (e) {}
  }
  function closeFocus() {
    focusId = null; linked = null; F.hidden = true; cancelAnimationFrame(raf); bgi = null; api = null; FX.clear();
    $('shell').removeAttribute('aria-hidden'); document.body.style.overflow = '';
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }
  let info = { prog: 0 };
  function focusTick(first) {
    const cd = find(focusId); if (!cd || !api) return;
    const now = Date.now(), o = occ(cd, now), p = split(o.t - now);
    const theme = previewTheme || cd.theme, T = THEMES[theme];
    api.set(o.mode === 'today' ? split(now - o.t) : p);
    info = { prog: o.prog, mode: o.mode };
    $('feb').textContent = T.words[o.mode];
    $('fmeta').innerHTML = '';
    const b = document.createElement('b'); b.textContent = fmtWhen(o.t); $('fmeta').append(b, cd.repeat === 'yearly' ? ' · every year' : '', cd.shared ? ' · shared' : '');
    $('fprog').style.width = (o.prog * 100).toFixed(3) + '%';
    $('fpl1').textContent = cd.repeat === 'yearly' ? 'Last time' : 'Created';
    $('fpl2').textContent = o.mode === 'down' ? (o.prog * 100).toFixed(1) + '% of the wait done' : 'Arrived';
    if (!first && lastMode === 'down' && o.mode !== 'down' && bgi) bgi.finale();
    lastMode = o.mode;
    if (p.total !== lastSec) { if (lastSec >= 0 && bgi) { bgi.pulse('sec'); if (p.s === 0) bgi.pulse('min'); } lastSec = p.total; }
  }
  let lastFrame = 0;
  function loop(now) {
    raf = requestAnimationFrame(loop);
    if (!bgi || now - lastFrame < 32) return;
    lastFrame = now; bgi.frame(now, info);
  }
  function buildThemeMenu() {
    const m = $('tmenu'); m.textContent = '';
    const cd = find(focusId); if (!cd) return;
    const cur = previewTheme || cd.theme;
    TKEYS.forEach(k => {
      const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-pressed', String(k === cur));
      b.appendChild(swatch(k));
      const n = document.createElement('span'); n.textContent = THEMES[k].name; b.appendChild(n);
      const s = document.createElement('small'); s.textContent = THEMES[k].blurb; b.appendChild(s);
      b.addEventListener('click', () => setFocusTheme(k));
      m.appendChild(b);
    });
  }
  async function setFocusTheme(k) {
    const cd = find(focusId); if (!cd) return;
    $('tmenu').hidden = true;
    const editable = !cd.linked && (!cd.shared || canEditShared(cd));
    if (!editable) { previewTheme = k; openFocus(cd.id, true); return; }
    previewTheme = null;
    if (cd.shared) { try { await dbNS.collection('countdowns').doc(cd.id).update({ theme: k }); } catch (e) {} cd.theme = k; }
    else { cd.theme = k; saveMine(); }
    openFocus(cd.id); renderList();
  }

  /* ================= wiring ================= */
  $('newBtn').addEventListener('click', () => openEditor(null));
  $('cancelBtn').addEventListener('click', closeEditor);
  $('scrim').addEventListener('click', e => { if (e.target === $('scrim')) closeEditor(); });
  // Save is a plain button: a sandboxed frame can swallow a form's submit event entirely
  $('sheet').addEventListener('submit', e => e.preventDefault());
  $('saveBtn').addEventListener('click', saveEditor);
  $('sheet').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') { e.preventDefault(); saveEditor(e); } });
  $('delBtn').addEventListener('click', deleteEditing);
  $('backBtn').addEventListener('click', closeFocus);
  $('editBtn').addEventListener('click', () => {
    const cd = find(focusId); if (!cd) return;
    if (!cd.linked) return openEditor(cd);
    const item = { id: uid(), title: cd.title, target: cd.target, theme: previewTheme || cd.theme, repeat: cd.repeat, createdAt: Date.now() };
    mine.push(item); saveMine(); linked = null; renderList(); openFocus(item.id);
  });
  $('shareBtn').addEventListener('click', async () => {
    const cd = find(focusId); if (!cd) return;
    const url = linkFor({ ...cd, theme: previewTheme || cd.theme });
    try { await navigator.clipboard.writeText(url); $('shareLbl').textContent = 'Link copied'; }
    catch (e) { window.prompt && ($('shareLbl').textContent = 'Copy from address bar'); try { history.replaceState(null, '', url); } catch (e2) {} }
    setTimeout(() => { $('shareLbl').textContent = 'Share link'; }, 2200);
  });
  $('themeBtn').addEventListener('click', e => { e.stopPropagation(); const m = $('tmenu'); if (m.hidden) buildThemeMenu(); m.hidden = !m.hidden; });
  F.addEventListener('click', e => { if (!$('tmenu').hidden && !$('tmenu').contains(e.target) && e.target !== $('themeBtn')) $('tmenu').hidden = true; });
  $('fsBtn').addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else if (F.requestFullscreen) F.requestFullscreen().catch(() => {}); });
  $('clearEx').addEventListener('click', () => { mine = mine.filter(c => !c.example); saveMine(); renderList(); });
  addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!$('scrim').hidden) closeEditor(); else if (!$('tmenu').hidden) $('tmenu').hidden = true; else if (focusId) closeFocus();
  });
  let rz = 0;
  addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { if (bgi) bgi.resize(); }); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (bgi) bgi.resize(); });

  try { $('tzname').textContent = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { $('tzname').textContent = 'local'; }
  loadMine(); renderList();
  setInterval(() => { tickList(); if (focusId) focusTick(false); }, 250);
  // re-sort once a minute so finished countdowns move down the list
  setInterval(renderList, 60000);
  function routeHash() {
    const s = /^#s-([\w-]+)$/.exec(location.hash);
    if (s) { const cd = readLink(s[1]); if (cd) { linked = cd; openFocus('link'); } return; }
    const m = /^#c-([a-z0-9]+)$/i.exec(location.hash); if (m && find(m[1]) && focusId !== m[1]) openFocus(m[1]);
  }
  routeHash();
  addEventListener('hashchange', routeHash);

  /* ================= shared list (db) ================= */
  (async () => {
    const C = window.claude; if (!C || !C.use) return;
    const [db, user] = await Promise.all([C.use('db'), C.use('user')]);
    if (!db) return;
    dbNS = db; userNS = user;
    if (user) {
      try { me.id = await user.id(); me.owner = await user.isOwner(); me.can = await user.can('data.write'); } catch (e) {}
    }
    sharedRO = me.can === false && !me.owner;
    sharedOK = true; renderList();
    db.collection('countdowns').onSnapshot(snap => {
      shared = snap.docs.map(d => {
        const v = d.data() || {};
        const ok = typeof v.title === 'string' && isFinite(v.target) && THEMES[v.theme];
        return ok ? { id: d.id, title: v.title.slice(0, 80), target: +v.target, theme: v.theme, repeat: v.repeat === 'yearly' ? 'yearly' : 'none', createdAt: +v.createdAt || 0, createdBy: typeof v.createdBy === 'string' ? v.createdBy : null, shared: true } : null;
      }).filter(Boolean);
      renderList();
      if (focusId && !find(focusId)) closeFocus();
      if (!focusId) routeHash();
    }, () => { sharedOK = false; renderList(); });
  })();
})();
</script>
